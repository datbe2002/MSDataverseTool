# Builds the Windows installer and publishes it on the Releases page, with
# the signed update feed (latest.json) the app checks for in-app updates.
# Release: bump the version (package.json, src-tauri/Cargo.toml,
# src-tauri/tauri.conf.json), commit, then push a matching tag:
#   git tag v0.2.0 && git push origin v0.2.0
# Needs the repo secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (from `npx tauri signer generate`);
# their public key is plugins.updater.pubkey in tauri.conf.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Fail in seconds, not after a 30-minute build.
      - name: Check the signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing: updates can't be signed."
            exit 1
          fi

      # The per-user setup.exe is enough to share; skipping the MSI saves a WiX download.
      # createUpdaterArtifacts also writes setup.exe.sig, signed with the key below.
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      # A fixed file name (GitHub would turn the space into a dot anyway), so
      # latest.json can point at the exact download URL.
      - name: Prepare the release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          src="src-tauri/target/release/bundle/nsis/Hexa Studio_${version}_x64-setup.exe"
          if [ ! -f "$src" ]; then
            echo "::error::$src not found — does the tag match the version in tauri.conf.json?"
            ls src-tauri/target/release/bundle/nsis
            exit 1
          fi
          mkdir -p out
          exe="Hexa.Studio_${version}_x64-setup.exe"
          cp "$src" "out/$exe"
          cp "$src.sig" "out/$exe.sig"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${exe}" \
          VERSION="$version" SIG_FILE="out/$exe.sig" node -e '
            const fs = require("fs");
            const entry = { signature: fs.readFileSync(process.env.SIG_FILE, "utf8").trim(), url: process.env.URL };
            const feed = {
              version: process.env.VERSION,
              notes: "See the release notes on GitHub.",
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": entry, "windows-x86_64-nsis": entry },
            };
            fs.writeFileSync("out/latest.json", JSON.stringify(feed, null, 2));
          '
          cat out/latest.json

      # Kept on the run page too, so a failed publish doesn't cost the build.
      - name: Keep the release files as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: hexa-studio-setup
          path: out/*
          if-no-files-found: error

      # latest.json on the newest release is the update feed every installed app reads.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Hexa Studio $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
