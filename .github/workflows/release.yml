# Builds the Windows installer and publishes it on the Releases page.
# Release: bump the version (package.json, src-tauri/Cargo.toml,
# src-tauri/tauri.conf.json), commit, then push a matching tag:
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # The per-user setup.exe is enough to share; skipping the MSI saves a WiX download.
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      # Kept on the run page too, so a failed publish doesn't cost the build.
      - name: Keep the installer as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: hexa-studio-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe \
            --title "Hexa Studio $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
