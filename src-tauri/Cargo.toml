[package]
name = "hexa-studio"
version = "0.2.1"
description = "Hexa Studio — a desktop toolkit for Power Platform / Dataverse (SQL over TDS + FetchXML, and more)"
authors = ["Hexa Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hexa_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# gzip is decoded in http.rs (to measure compressed bytes), not by ureq.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
flate2 = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
regex = "1"
# SQL engine over Dataverse (FetchXML / Web API) — the "SQL 4 CDS"-style path.
datafusion = "55"
async-trait = "0.1"
futures = "0.3"
percent-encoding = "2"
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tiny_http = "0.12"
webbrowser = "1"

# In-app updates from GitHub Releases (signed; see .github/workflows/release.yml).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Open / Save file dialogs (FetchXML files), called from Rust only.
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
# Thin LTO on parallel codegen units: fat LTO with a single unit made the
# release build (DataFusion is big) take over an hour on a GitHub runner,
# for an exe only ~10-20% smaller.
lto = "thin"
strip = true
